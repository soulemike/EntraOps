name: "Git - Push"
description: "Commit and push all pending changes to the repository, refusing to push generated tenant data on public repositories."

inputs:
  paths:
    description: "Space-separated pathspecs to stage. Defaults to the whole working tree."
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Publish output to private GitHub repository
      shell: pwsh
      env:
        ENTRAOPS_PUBLISH_PATHS: ${{ inputs.paths }}
      run: ./.github/scripts/Publish-EntraOpsGitHubChanges.ps1 -Paths (@($env:ENTRAOPS_PUBLISH_PATHS -split '\s+') | Where-Object { $_ }) -AccessToken $env:GITHUB_TOKEN
