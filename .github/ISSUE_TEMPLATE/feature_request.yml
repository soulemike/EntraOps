name: Feature request
description: Propose an improvement to EntraOps
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before proposing a feature. Do not include credentials, tokens, or unredacted tenant data.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user or operator problem, not only the implementation idea.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior, affected workflows, and security or compatibility considerations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request does not contain secrets, tokens, personal data, or tenant-sensitive data.
          required: true
