# Azure DevOps Pipeline for EntraOps Log Analytics Ingestion (BSC Tenant)
# Pushes collected PrivilegedEAM JSON from ado/main to Log Analytics via Logs Ingestion API.
#
# Prerequisites:
#   1. Data Collection Rule (DCR) and Data Collection Endpoint (DCE) must exist
#      in the target resource group with a data flow for Custom-PrivilegedEAM_CL.
#   2. The service principal used by the ADO Service Connection must have
#      "Monitoring Metrics Publisher" role on the DCR (Log Analytics Contributor
#      on the resource group is NOT sufficient for the Logs Ingestion API).
#   3. EntraOpsConfig.json must contain a populated LogAnalytics section.
#   4. The pull pipeline must have run and committed JSON to ado/main.
#
# Trigger modes:
#   A) Automatic: after azure-pipelines-pull completes (configure build completion
#      in ADO UI, or match the pipeline resource name below).
#   B) Manual: run on-demand from the Pipelines UI.
#   C) Scheduled: add a schedules block if desired.

trigger: none
pr: none

# Option A: Trigger automatically when the pull pipeline completes.
# The source name must match the pull pipeline's name as configured in ADO.
resources:
  pipelines:
  - pipeline: entraops-pull
    source: azure-pipelines-pull
    trigger:
      branches:
        include:
        - ado/main

variables:
  # Path to the environment-specific config file (committed in ado/main)
  ConfigFile: ./EntraOpsConfig.json
  # ADO Service Connection name targeting the BSC tenant (Workload Identity Federation)
  AzureServiceConnection: $(EntraOpsBscServiceConnection)

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  persistCredentials: true
  displayName: 'Checkout repository'

# Ingest collected PrivilegedEAM JSON to BSC tenant Log Analytics custom table.
# Connect-EntraOps is intentionally omitted because this step does not require
# Microsoft Graph access; it only reads local JSON and pushes to the DCR/DCE
# using the Azure PowerShell context provided by AzurePowerShell@5.
- task: AzurePowerShell@5
  displayName: 'Ingest PrivilegedEAM to Log Analytics'
  inputs:
    azureSubscription: '$(AzureServiceConnection)'
    ScriptType: InlineScript
    Inline: |
      Import-Module ./EntraOps
      $ErrorActionPreference = "Stop"

      $Config = Get-Content -Path '$(ConfigFile)' | ConvertFrom-Json -Depth 10 -AsHashtable

      if ($null -eq $Config.LogAnalytics) {
        Write-Error "LogAnalytics section missing from $(ConfigFile)."
      }

      if ($Config.LogAnalytics.IngestToLogAnalytics -ne $true) {
        Write-Host "IngestToLogAnalytics is not enabled in config. Skipping ingestion."
        exit 0
      }

      $RequiredParams = @('DataCollectionRuleName','DataCollectionResourceGroupName','DataCollectionRuleSubscriptionId')
      foreach ($Param in $RequiredParams) {
        if ([string]::IsNullOrWhiteSpace($Config.LogAnalytics[$Param])) {
          Write-Error "Required LogAnalytics config parameter '$Param' is missing or empty."
        }
      }

      $Params = @{
        ImportPath                     = "./PrivilegedEAM"
        DataCollectionRuleName         = $Config.LogAnalytics.DataCollectionRuleName
        DataCollectionResourceGroupName= $Config.LogAnalytics.DataCollectionResourceGroupName
        DataCollectionRuleSubscriptionId = $Config.LogAnalytics.DataCollectionRuleSubscriptionId
        TableName                      = if ($Config.LogAnalytics.TableName) { $Config.LogAnalytics.TableName } else { "PrivilegedEAM_CL" }
      }

      # Optional: limit RBAC systems or principal types if defined in config
      if ($Config.RbacSystems) {
        $Params.RbacSystems = $Config.RbacSystems
      }

      Save-EntraOpsPrivilegedEAMInsightsCustomTable @Params
    pwsh: true
    preferredAzurePowerShellVersion: '12.3.0'
